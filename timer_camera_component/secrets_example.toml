# ============================================================
# Streamlit secrets template - REAL OTP EMAIL SETUP
# ============================================================
# Locally: save this file as  .streamlit/secrets.toml  in your project folder
#          (create the .streamlit folder if it doesn't exist yet).
# On Streamlit Community Cloud: go to your app -> Settings -> Secrets, and
#          paste the same key = "value" lines in there instead of using a file.
#
# Do NOT commit secrets.toml to GitHub - add ".streamlit/secrets.toml" to your
# .gitignore so your app password never ends up in your public repo.

# ---- Required for real email OTPs ----
EMAIL_ADDRESS = "your_gmail_address@gmail.com"
EMAIL_APP_PASSWORD = "your16charapppassword"
# How to get an App Password (takes ~2 minutes, free):
#   1. Turn on 2-Step Verification on your Google account, if not already on:
#      https://myaccount.google.com/security
#   2. Go to https://myaccount.google.com/apppasswords
#   3. Create a new app password (name it "AI Body Measurement" or similar)
#   4. Google gives you a 16-character password - paste that above, NOT your
#      normal Gmail login password.

# ---- Optional, only if not using Gmail ----
# SMTP_SERVER = "smtp.yourprovider.com"
# SMTP_PORT = 587

# ---- Optional: real SMS OTPs via Twilio (off by default) ----
# Requires a Twilio account (free trial available) and adding "twilio" to
# requirements.txt. Trial accounts can only text numbers you've manually
# verified in the Twilio console.
# TWILIO_ACCOUNT_SID = "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# TWILIO_AUTH_TOKEN = "your_auth_token"
# TWILIO_FROM_NUMBER = "+1xxxxxxxxxx"
